name: Tests

# Runs the full pytest suite across the supported Python × Django matrix on every push and pull
# request to main, and enforces the 100% line + branch coverage bar on the shipped `snapadmin/` package. Those six
# matrix jobs mock Elasticsearch / Redis / Celery and use an in-memory SQLite database, so they need
# no service containers. The seventh job, `real-services`, is the deliberate exception: it runs the
# same suite against a real PostgreSQL and a live Elasticsearch — see its own comment below. The
# eighth, `static-analysis`, runs Ruff (lint, format, security rules) and mypy.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}
  # Reusable: the publish + github-release workflows call this as a gate, so a release only
  # proceeds when the whole matrix is green.
  workflow_call: {}

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python }} · Django ${{ matrix.django }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
        django: ["5.2", "6.0"]
        exclude:
          # Django 6.0 requires Python >= 3.12.
          - python: "3.10"
            django: "6.0"
          - python: "3.11"
            django: "6.0"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        # Deliberately NOT `pip install -e .` — the suite runs against the source tree (as it does
        # locally), and several tests + coverage branches assert that django-snapadmin is *not* an
        # installed distribution (the PackageNotFoundError fallbacks in __init__/fetch/licensing).
        # demo/requirements.txt provides every runtime + optional dependency the suite imports.
        run: |
          python -m pip install --upgrade pip
          pip install -r demo/requirements.txt
          pip install "Django~=${{ matrix.django }}.0"

      - name: Install the age CLI (binary backend for AGE-encrypted backups)
        # ubuntu-latest ships past Ubuntu 22.04, so `age` is a first-party apt
        # package — this gives the SNAPADMIN_BACKUP_AGE_BACKEND="binary" tests
        # a real round-trip against the actual tool, not a mock.
        run: sudo apt-get update && sudo apt-get install -y age

      - name: Show resolved versions
        run: |
          python --version
          python -c "import django; print('Django', django.get_version())"

      - name: Run tests with 100% line + branch coverage gate
        # `python -m pytest` (not the bare `pytest` console script) so the repository root lands on
        # sys.path — the suite imports `snapadmin` and `demo` straight from the source tree, exactly
        # as it runs locally. A bare `pytest` would fail to import `demo.core.settings_test`.
        run: python -m pytest --cov=snapadmin --cov-branch --cov-report=term-missing --cov-fail-under=100

  # ───────────────────────────────────────────────────────────────────────────
  # The same suite, against a real PostgreSQL.
  #
  # The matrix above varies Python and Django and runs every one of its six jobs
  # on in-memory SQLite, so a difference between database backends cannot fail
  # it — while the package advertises PostgreSQL support and carries
  # backend-specific code (`EstimatedCountPaginator`'s `pg_class.reltuples`
  # query, `backup.py`'s `pg_dump` path). 100% line coverage is fully compatible
  # with never having talked to PostgreSQL at all.
  #
  # ONE job, ONE combination, deliberately — a backend difference does not
  # depend on the interpreter version, so running this across the matrix would
  # cost six times the minutes to learn the same thing. The matrix keeps running
  # exactly as it does today; this sits beside it.
  #
  # No coverage gate here: the matrix already enforces it, and the two backends
  # legitimately take different branches (the estimated-count path returns early
  # on any non-PostgreSQL vendor), so demanding 100% from a single backend would
  # be asking for the wrong thing.
  static-analysis:
    # Ruff lint + format are clean and blocking. mypy runs over snapadmin/ with
    # raised strictness on encryption/, crypto and sharding/ (clean, and any
    # regression there shows up in the report); the remaining backlog keeps it
    # advisory for now (#QA1c) — the step reports and does not fail the job.
    name: Static analysis · Ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # mypy's Django plugin boots demo.core.settings_test, so it needs the
        # same runtime stack the suite does.
        run: |
          python -m pip install --upgrade pip
          pip install -r demo/requirements.txt
          pip install "ruff>=0.6" "mypy>=1.10" "django-stubs>=5.0"

      - name: Ruff lint (incl. security rules)
        run: ruff check snapadmin

      - name: Ruff format
        run: ruff format --check snapadmin

      - name: mypy (advisory)
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: mypy

  real-services:
    name: Real services · py3.12 · Django 5.2
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: snapadmin
          POSTGRES_PASSWORD: snapadmin
          POSTGRES_DB: snapadmin_test
        ports:
          - 5432:5432
        # Without the health check the suite races the server's first start-up.
        options: >-
          --health-cmd "pg_isready -U snapadmin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      elasticsearch:
        # The same image the demo's compose file ships, so this job exercises
        # what a user actually runs rather than some other version that happens
        # to be current. `tests/test_version_sync.py` fails if the two drift
        # apart, and if either leaves the `[elasticsearch]` extra's range.
        image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          # A single-shard test cluster needs nothing like the default heap, and
          # a runner that swaps is a runner that times out.
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fsS http://localhost:9200/_cluster/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r demo/requirements.txt
          pip install "Django~=5.2.0"

      - name: Install the age CLI (binary backend for AGE-encrypted backups)
        run: sudo apt-get update && sudo apt-get install -y age

      - name: Show resolved versions
        run: |
          python --version
          python -c "import django; print('Django', django.get_version())"
          psql --version

      - name: Run the suite against PostgreSQL
        # The identical test files: nothing branches on the backend, so the same
        # assertions have to hold on either one.
        env:
          SNAPADMIN_TEST_POSTGRES: localhost
          SNAPADMIN_TEST_POSTGRES_PORT: "5432"
          SNAPADMIN_TEST_POSTGRES_DB: snapadmin_test
          SNAPADMIN_TEST_POSTGRES_USER: snapadmin
          SNAPADMIN_TEST_POSTGRES_PASSWORD: snapadmin
        run: python -m pytest

      - name: Run the live-Elasticsearch tests
        # Deselected everywhere else (`-m "not real_es"` in pytest.ini), so this
        # is the only place they run. `-m real_es` on the command line overrides
        # that default. They are what proves the query DSL is valid: a mocked
        # client accepts a malformed `terms` clause or a broken `search_after`
        # cursor without complaint, and Elasticsearch answers 400.
        env:
          SNAPADMIN_TEST_POSTGRES: localhost
          SNAPADMIN_TEST_POSTGRES_PORT: "5432"
          SNAPADMIN_TEST_POSTGRES_DB: snapadmin_test
          SNAPADMIN_TEST_POSTGRES_USER: snapadmin
          SNAPADMIN_TEST_POSTGRES_PASSWORD: snapadmin
          SNAPADMIN_TEST_ES_URL: http://localhost:9200
        run: python -m pytest -m real_es

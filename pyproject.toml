[tool.poetry]
name = "django-snapadmin"
version = "0.1.0b7"
description = "Define your Django models once — instantly get an admin panel, REST API, GraphQL and full-text search. Zero boilerplate."
authors = ["Alexander Wiese"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/drofji/django-snapadmin"
repository = "https://github.com/drofji/django-snapadmin.git"
documentation = "https://drofji.github.io/django-snapadmin/"
keywords = ["django", "admin", "rest-api", "graphql", "elasticsearch", "unfold", "declarative"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
]

packages = [{include = "snapadmin"}]

include = [
    "snapadmin/templates/**/*",
    "snapadmin/static/**/*",
    "snapadmin/locale/**/*",
    # `snapadmin-new` project-generation templates (rendered with stdlib string.Template).
    "snapadmin/scaffold/templates/**/*",
    "docs/releases/**/*.txt",
    "docs/migrations/**/*.md",
    { path = "CHANGELOG.md", format = ["sdist", "wheel"] },
    # Machine-readable docs map for AI assistants (llmstxt.org). Also served from
    # GitHub Pages at /llms.txt; the root copy travels with the sdist.
    { path = "llms.txt", format = ["sdist", "wheel"] },
    { path = "THIRD_PARTY_NOTICES.md", format = ["sdist", "wheel"] },
    { path = "SECURITY.md", format = ["sdist"] },
]

# Extra links shown in the PyPI sidebar ("Project links"). `homepage`, `repository` and
# `documentation` above already render as Homepage / Repository / Documentation; this table
# adds the ones Poetry has no dedicated key for.
[tool.poetry.urls]
Issues = "https://github.com/drofji/django-snapadmin/issues"
Releases = "https://github.com/drofji/django-snapadmin/releases"
Changelog = "https://github.com/drofji/django-snapadmin/blob/main/CHANGELOG.md"

# Console scripts installed on the PATH by `pip install django-snapadmin`.
[tool.poetry.scripts]
snapadmin-demo = "snapadmin.quickstart.cli:main"
snapadmin-init = "snapadmin.integrate.cli:main"
# `snapadmin-new <project>` — generates a project you keep (admin + REST API + GraphQL
# from one worked model; SQLite by default, --full adds Docker/Postgres/Redis/ES).
snapadmin-new = "snapadmin.scaffold.cli:main"
# Shims that forward to the manage.py commands of the same name. Both spellings are
# registered on purpose: the dashed one matches the console scripts above, the
# underscored one matches the management-command name people read in the docs and
# then type in a shell. Neither should be a "command not found" dead end.
snapadmin-info = "snapadmin.manage_cli:info_main"
snapadmin_info = "snapadmin.manage_cli:info_main"
snapadmin-license-check = "snapadmin.manage_cli:license_check_main"
snapadmin_license_check = "snapadmin.manage_cli:license_check_main"

[tool.poetry.dependencies]
python = ">=3.10"
Django = ">=5.2"
structlog = ">=24.1.0"
# nh3 stays a core dependency (D8/#DEP1e) even though the REST/GraphQL stack below
# moves to extras: a missing nh3 must fail closed on a security-relevant default
# (wysiwyg sanitize-on-write), which is not a state a normal install should reach.
# It is permissive (MIT) and tiny — see snapadmin/sanitize.py's _load_nh3().
nh3 = ">=0.2.0"

# Optional: the REST API — DRF, its OpenAPI schema generator and its filter backend
# (SNAPADMIN_REST_API_ENABLED / SNAPADMIN_SWAGGER_ENABLED). An admin-only install
# pulls none of these; snapadmin.urls already turns a switched-on-but-missing
# feature into an ImproperlyConfigured naming this extra, not a bare ImportError.
djangorestframework = {version = ">=3.15.0", optional = true}
drf-spectacular = {version = ">=0.27.0", optional = true}
django-filter = {version = ">=24.0", optional = true}

# Optional: the generated GraphQL schema (SNAPADMIN_GRAPHQL_ENABLED). Independent
# of [api] — graphene-django pulls Django + graphene + graphql-core, none of the
# REST packages above.
graphene-django = {version = ">=3.2.0", optional = true}

# Optional: django-unfold theme (permissive MIT). SnapAdmin resolves its admin base class
# lazily — it uses Unfold's themed ModelAdmin/widgets when installed and enabled in
# INSTALLED_APPS, and falls back to Django's stock admin otherwise. Install the [theme] extra
# for the full themed UI; the core admin works without it.
django-unfold = {version = ">=0.40.0", optional = true}

# Optional: Elasticsearch integration (required when ELASTICSEARCH_ENABLED=True)
elasticsearch = {version = ">=8.0.0", optional = true}

# Optional: Celery background tasks (required for Celery Beat schedules)
celery = {version = ">=5.3.0", optional = true}
django-celery-beat = {version = ">=2.6.0", optional = true}
django-celery-results = {version = ">=2.5.0", optional = true}

# Optional: SSH/SFTP offsite backup transport (SNAPADMIN_BACKUP_SFTP_*)
paramiko = {version = ">=3.0.0", optional = true}

# Optional: django-extra-settings — the package core does not use it; it is only
# needed if you want a dynamic key/value Settings model in the admin (as the demo shows).
django-extra-settings = {version = ">=0.12.0", optional = true}

# Optional: wysiwyg rich-text fields (SnapRichTextField / wysiwyg=True). django-ckeditor-5
# bundles CKEditor 5, which is GPL / commercial-licensed — kept out of the core so the
# base package carries no GPL/commercial editor unless you opt into rich-text editing.
django-ckeditor-5 = {version = ">=0.0.12", optional = true}

# Optional: django-admin-autocomplete-filter (LGPL-3.0). The package core does not import
# it — kept out of core so the base tree is strictly permissive (MIT/BSD/Apache). Add it only
# if you want AutocompleteFilter list filters in your own admin.
django-admin-autocomplete-filter = {version = ">=0.7.1", optional = true}

# Optional: XLSX output for the async export API (export_format="xlsx"). openpyxl is MIT, so
# this is a size/scope call rather than a licence one — most installs export csv/json and have
# no reason to carry a spreadsheet writer. Imported lazily in snapadmin/exporting.py.
openpyxl = {version = ">=3.1.0", optional = true}

# Optional: AGE-encrypted backups (SNAPADMIN_BACKUP_AGE_RECIPIENTS). pyrage (MIT) is in-process
# bindings over the Rust `age` crate — no OS package required, works identically on every
# platform pip works on. An operator who would rather manage encryption through the OS package
# manager can skip this extra entirely and set SNAPADMIN_BACKUP_AGE_BACKEND="binary" to use the
# `age` command-line tool instead (e.g. `apt install age` on Debian 12+/Ubuntu 22.04+). Imported
# lazily in snapadmin/crypto.py.
pyrage = {version = ">=1.4.0", optional = true}

# Optional: S3-compatible offsite backup transport (SNAPADMIN_BACKUP_S3_*). boto3 (Apache-2.0)
# talks to AWS S3 and, via SNAPADMIN_BACKUP_S3_ENDPOINT_URL, any S3-compatible provider — MinIO,
# Backblaze B2, Hetzner Object Storage, Wasabi. Hetzner Storage Box is a different product
# (SFTP/SCP/WebDAV) and uses the [backup] extra instead. Imported lazily in snapadmin/backup.py.
boto3 = {version = ">=1.34.0", optional = true}

[tool.poetry.extras]
theme = ["django-unfold"]
elasticsearch = ["elasticsearch"]
celery = ["celery", "django-celery-beat", "django-celery-results"]
backup = ["paramiko"]
age = ["pyrage"]
s3 = ["boto3"]
extra-settings = ["django-extra-settings"]
wysiwyg = ["django-ckeditor-5"]
autocomplete-filter = ["django-admin-autocomplete-filter"]
xlsx = ["openpyxl"]
api = ["djangorestframework", "drf-spectacular", "django-filter"]
graphql = ["graphene-django"]
all = ["django-unfold", "elasticsearch", "celery", "django-celery-beat", "django-celery-results", "paramiko", "pyrage", "boto3", "django-extra-settings", "django-ckeditor-5", "django-admin-autocomplete-filter", "openpyxl", "djangorestframework", "drf-spectacular", "django-filter", "graphene-django"]

[tool.poetry.group.dev.dependencies]
black = "^24.0.0"
flake8 = "^7.0.0"
pytest = "^8.0.0"
pytest-django = "^4.8.0"
pytest-cov = "^5.0.0"
faker = "^25.0.0"
# Dev extras (installed via demo/requirements.txt)
# The suite exercises the REST API and GraphQL end to end; the package core
# imports both lazily now that they are the [api]/[graphql] extras (#DEP1e).
djangorestframework = ">=3.15.0"
drf-spectacular = ">=0.27.0"
django-filter = ">=24.0"
graphene-django = ">=3.2.0"
elasticsearch = ">=8.0.0"
celery = ">=5.3.0"
django-celery-beat = ">=2.6.0"
django-celery-results = ">=2.5.0"
redis = ">=5.0.0"
paramiko = ">=3.0.0"
# Demo uses a dynamic Settings model; the package core does not depend on it.
django-extra-settings = ">=0.12.0"
# Demo uses wysiwyg rich-text fields; the package core does not depend on it.
django-ckeditor-5 = ">=0.0.12"
# Listed in the demo project's INSTALLED_APPS; the package core does not import it (LGPL, optional).
django-admin-autocomplete-filter = ">=0.7.1"
# The suite covers XLSX export end to end; the package core imports it lazily.
openpyxl = ">=3.1.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

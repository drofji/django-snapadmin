[pytest]
DJANGO_SETTINGS_MODULE = demo.core.settings_test
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short -m "not real_es"
markers =
    real_es: needs a live Elasticsearch (deselected by default; see tests/test_elasticsearch_live.py)
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

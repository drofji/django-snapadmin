[pytest]
DJANGO_SETTINGS_MODULE = demo.core.settings_test
# mutmut's working copy (see scripts/mutation.py) holds a full second copy of
# tests/ — collecting it would double every run and import rewritten source.
norecursedirs = mutants .* build dist *.egg node_modules
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short -m "not real_es and not e2e"
markers =
    real_es: needs a live Elasticsearch (deselected by default; see tests/test_elasticsearch_live.py)
    e2e: drives a real browser against a live server (deselected by default; see tests/e2e/conftest.py)
    security_regression: pins a shipped security fix (applied from tests/security_regressions.py)
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
